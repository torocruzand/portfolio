    <style>
        /* ========================================
           CSS Variables & Theme System
           ======================================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --border-color: #e5e7eb;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-heading: 'Space Grotesk', var(--font-primary);
        }

        .dark-mode {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 20px;
        }

        .dark-mode .navbar {
            background: rgba(10, 10, 10, 0.9);
        }

        body:not(.dark-mode) .navbar {
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            font-family: var(--font-heading);
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-dot {
            color: var(--accent-primary);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .language-switcher {
            display: flex;
            gap: 5px;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 8px;
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition-smooth);
        }

        .lang-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            color: var(--text-primary);
        }

        .theme-toggle:hover {
            background: var(--accent-gradient);
            color: white;
            transform: rotate(15deg);
        }

        .sun-icon,
        .moon-icon {
            transition: var(--transition-smooth);
        }

        .dark-mode .sun-icon {
            display: none;
        }

        .dark-mode .moon-icon {
            display: block;
        }

        body:not(.dark-mode) .sun-icon {
            display: block;
        }

        body:not(.dark-mode) .moon-icon {
            display: none;
        }

        /* Error Container */
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 0 20px;
        }

        /* Background Effects */
        .error-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 0;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            top: -250px;
            left: -250px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            bottom: -200px;
            right: -200px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            top: 50%;
            right: 10%;
            animation-delay: 10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Error Content */
        .error-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 Illustration */
        .error-illustration {
            margin-bottom: 40px;
            position: relative;
        }

        .error-number {
            font-size: clamp(80px, 15vw, 180px);
            font-weight: 800;
            font-family: var(--font-heading);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {

            0%,
            100% {
                transform: translate(0);
            }

            10% {
                transform: translate(-2px, 2px);
            }

            20% {
                transform: translate(2px, -2px);
            }

            30% {
                transform: translate(-2px, -2px);
            }

            40% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(0);
            }
        }

        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .icon {
            position: absolute;
            color: var(--accent-primary);
            opacity: 0.3;
            animation: floatIcon 4s ease-in-out infinite;
        }

        .icon:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .icon:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .icon:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .icon:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .error-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            margin-bottom: 20px;
            font-family: var(--font-heading);
        }

        .error-message {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
            border: 2px solid transparent;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        /* Helpful Links */
        .helpful-links {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
        }

        .helpful-links h3 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .link-item {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
        }

        .link-item:hover {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .error-number {
                font-size: 100px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .link-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        // Translations
        const translations = {
            en: {
                title: 'Page Not Found',
                message: "Oops! The page you're looking for seems to have wandered off into the digital void. Don't worry, even the best developers get lost sometimes.",
                home: 'Back to Home',
                back: 'Go Back',
                helpful: 'Or try these pages:',
                about: 'About',
                projects: 'Projects',
                skills: 'Skills',
                contact: 'Contact'
            },
            es: {
                title: 'Página No Encontrada',
                message: '¡Ups! La página que buscas parece haberse perdido en el vacío digital. No te preocupes, hasta los mejores desarrolladores se pierden a veces.',
                home: 'Volver al Inicio',
                back: 'Regresar',
                helpful: 'O prueba estas páginas:',
                about: 'Sobre mí',
                projects: 'Proyectos',
                skills: 'Habilidades',
                contact: 'Contacto'
            },
            pt: {
                title: 'Página Não Encontrada',
                message: 'Ops! A página que você procura parece ter se perdido no vazio digital. Não se preocupe, até os melhores desenvolvedores se perdem às vezes.',
                home: 'Voltar ao Início',
                back: 'Voltar',
                helpful: 'Ou tente estas páginas:',
                about: 'Sobre',
                projects: 'Projetos',
                skills: 'Habilidades',
                contact: 'Contato'
            }
        };

        // State
        let currentLang = localStorage.getItem('preferredLanguage') || 'en';
        let isDarkMode = localStorage.getItem('darkMode') !== 'false';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initLanguage();
        });

        // Theme Management
        function initTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }

            document.querySelector('.theme-toggle').addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', isDarkMode);
            });
        }

        // Language Management
        function initLanguage() {
            const langButtons = document.querySelectorAll('.lang-btn');

            langButtons.forEach(btn => {
                if (btn.dataset.lang === currentLang) {
                    btn.classList.add('active');
                }

                btn.addEventListener('click', () => {
                    currentLang = btn.dataset.lang;
                    localStorage.setItem('preferredLanguage', currentLang);

                    langButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    updateTranslations();
                });
            });

            updateTranslations();
        }

        function updateTranslations() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.dataset.i18n;
                if (translations[currentLang][key]) {
                    element.textContent = translations[currentLang][key];
                }
            });
        }
    </script>
