<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090A">
    <meta name="robots" content="noindex">
    <title>Offline · TOROCRUZAND</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        .offline-card {
            max-width: 560px;
            padding: 32px;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            font-family: var(--font-mono);
        }

        .offline-card h1 {
            margin: 12px 0 16px;
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .offline-card p {
            margin-bottom: 24px;
            color: var(--ink-muted);
            font-size: var(--fs-small);
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <p class="micro"><span class="accent">ERR</span> · LINK DOWN · 0x0000_0000</p>
        <h1>Signal lost</h1>
        <p>No network route to torocruzand.com. The cached shell is still mounted — reconnect and retry.</p>
        <a class="key-cta primary" href="/"><kbd aria-hidden="true">↻</kbd> Retry connection</a>
    </main>
</body>
</html>
